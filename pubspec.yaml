name: pasar_tani_nelayan
description: "Proyek Aplikasi Pasar Tani dan Nelayan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.7

  # File/image picker (support web)
  file_picker: ^10.2.0
  image_picker: ^1.0.7
  image_picker_for_web: ^3.0.4

  # Maps & Location
  flutter_map: ^8.1.1
  latlong2: ^0.9.0
  geocoding: ^4.0.0
  http: ^1.2.1

  # upload gambar produk
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/dummy_map.jpg

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Bold.ttf
        - asset: fonts/Poppins-Medium.ttf
        - asset: fonts/Poppins-Light.ttf
        - asset: fonts/Poppins-Italic.ttf
        - asset: fonts/Poppins-Thin.ttf
        - asset: fonts/Poppins-ExtraBold.ttf
        - asset: fonts/Poppins-SemiBold.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Bold.ttf
        - asset: fonts/Inter-Light.ttf
        - asset: fonts/Inter-Italic.ttf
        - asset: fonts/Inter-Medium.ttf
